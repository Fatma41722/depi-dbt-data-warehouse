
version: 2

models:
  - name: ODS
    description: "Operational Data Store view that exposes the raw employee data from SQL Server."
    columns:
      - name: ID
        description: "Unique employee identifier."

      - name: first_name
        description: "Employee's first name as received from the source."

      - name: last_name
        description: "Employee's last name as received from the source."

      - name: gender
        description: "Employee's gender."

      - name: email
        description: "Employee's email address."

      - name: DOB
        description: "Employee's date of birth."

      - name: salary
        description: "Employee's salary as received from the source."

      - name: department
        description: "Employee's department."

      - name: country
        description: "Employee's country."
